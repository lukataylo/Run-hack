<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track B test bench</title>
<style>
  :root { --bg:#09090b; --card:#17171a; --text:#f4f4f5; --dim:#8e8e96; --accent:#ff5b14; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px -apple-system,system-ui,sans-serif; padding:20px; }
  h2 { font-size:10px; letter-spacing:.14em; text-transform:uppercase;
       color:var(--dim); margin:26px 0 10px; }
  .card { background:var(--card); border-radius:18px; padding:16px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button { background:#222226; color:var(--text); border:1px solid #2e2e33;
           border-radius:10px; padding:8px 14px; font:inherit; cursor:pointer; }
  button:active { background:var(--accent); border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #bot { width:220px; height:220px; }
  label { display:flex; align-items:center; gap:10px; color:var(--dim);
          font-variant-numeric:tabular-nums; margin:6px 0; }
  label span.k { width:70px; }
  label span.v { width:52px; text-align:right; color:var(--text); }
  input[type=range] { flex:1; accent-color:var(--accent); }
  #log { color:var(--dim); font:12px ui-monospace,monospace; white-space:pre-wrap; }
</style>
</head>
<body>
<h2>Mascot</h2>
<div class="card row" style="align-items:center">
  <div id="bot"></div>
  <div class="row" id="states" style="flex-direction:column;align-items:flex-start"></div>
</div>

<h2>Voice</h2>
<div class="card">
  <div class="row" id="voices"></div>
  <p id="voice-note" style="color:var(--dim);margin:10px 0 0">First tap runs unlock() inside the gesture.</p>
</div>

<h2>Music</h2>
<div class="card">
  <div class="row">
    <button id="m-start">Start</button>
    <button id="m-stop">Stop</button>
    <button id="m-cue">Fire cue (duck + sting)</button>
    <button id="m-duck">duck(-8, 1.5)</button>
    <span id="m-bpm" style="color:var(--dim);align-self:center;font-variant-numeric:tabular-nums">stopped</span>
  </div>
  <div id="sliders" style="margin-top:12px"></div>
</div>

<h2>Log</h2>
<div class="card"><div id="log"></div></div>

<script type="module">
import { mountBot } from './bot.js';
import * as voice from './voice.js';
import { create } from './music.js';

const log = (...a) => {
  const el = document.getElementById('log');
  el.textContent = (a.join(' ') + '\n' + el.textContent).slice(0, 4000);
  console.log('[bench]', ...a);
};

// --- mascot ---
const bot = mountBot(document.getElementById('bot'));
const states = ['idle','listening','working','happy','suspicious','alerting','sleeping','celebrate','proud'];
const stEl = document.getElementById('states');
for (const s of states) {
  const b = document.createElement('button');
  b.textContent = s;
  b.onclick = () => {
    bot.setState(s);
    stEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    log('bot.setState(' + s + ')');
  };
  stEl.appendChild(b);
}
stEl.querySelector('button').classList.add('on');

// --- voice ---
const CUES = {
  cadence:   "Quicker feet. Shorten your stride.",
  bounce:    "Too much bounce. Run softer, drive forward.",
  asymmetry: "You're favouring one side. Even it out.",
  sway:      "Your head is rocking. Eyes forward, run tall.",
};
const vEl = document.getElementById('voices');
let didUnlock = false;
for (const [fault, text] of Object.entries(CUES)) {
  const b = document.createElement('button');
  b.textContent = fault;
  b.onclick = () => {
    if (!didUnlock) { voice.unlock(); didUnlock = true; log('voice.unlock()'); }
    voice.say(text, fault);
    log('say [' + fault + '] "' + text + '"');
  };
  vEl.appendChild(b);
}

// --- music ---
const music = create();
const params = [
  ['cadence', 130, 210, 170, ' spm'],
  ['score',   0, 100, 85, ''],
  ['bounce',  4, 16, 8, ' m/s2'],
  ['asym',    0, 0.3, 0.05, ''],
  ['sway',    0, 1, 0.3, ''],
];
const metrics = {};
const slEl = document.getElementById('sliders');
for (const [name, min, max, val, unit] of params) {
  metrics[name] = val;
  const step = max <= 1 ? 0.01 : 1;
  const lab = document.createElement('label');
  lab.innerHTML = `<span class="k">${name}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${val}"><span class="v">${val}${unit}</span>`;
  const inp = lab.querySelector('input'), out = lab.querySelector('.v');
  inp.oninput = () => { metrics[name] = +inp.value; out.textContent = inp.value + unit; };
  slEl.appendChild(lab);
}
document.getElementById('m-start').onclick = async () => {
  if (!didUnlock) { voice.unlock(); didUnlock = true; }
  await music.start();
  log('music.start()');
};
document.getElementById('m-stop').onclick = () => { music.stop(); log('music.stop()'); };
document.getElementById('m-duck').onclick = () => { music.duck(-8, 1.5); log('music.duck(-8, 1.5)'); };
document.getElementById('m-cue').onclick = () => { music.onCue(); log('music.onCue()'); };
setInterval(() => { if (music.running) music.update({ ...metrics }); }, 1000); // 1 Hz like the app loop

// live BPM readout while the engine runs (also handy for console debugging)
window.__bench = { music, bot, metrics };
setInterval(() => {
  const T = window.Tone;
  document.getElementById('m-bpm').textContent = music.running && T
    ? 'BPM ' + T.Transport.bpm.value.toFixed(1) + ' | ' + T.Transport.position
    : 'stopped';
}, 500);

log('bench ready');
</script>
</body>
</html>
