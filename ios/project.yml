name: AirRunCoach
options:
  bundleIdPrefix: com.lukadadiani
  deploymentTarget:
    iOS: "16.0"
targets:
  AirRunCoach:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # bundle the whole web app as an offline cold-start fallback
      - { path: ../index.html, buildPhase: resources }
      - { path: ../coach.js, buildPhase: resources }
      - { path: ../head.js, buildPhase: resources }
      - { path: ../voice.js, buildPhase: resources, optional: true }
      - { path: ../persona.js, buildPhase: resources, optional: true }
      - { path: ../bot.js, buildPhase: resources, optional: true }
      - { path: ../bot-data.js, buildPhase: resources, optional: true }
      - { path: ../music.js, buildPhase: resources, optional: true }
      - { path: ../session.js, buildPhase: resources, optional: true }
      - { path: ../pods3d.js, buildPhase: resources, optional: true }
      # without these the offline cold-start silently loses phone motion,
      # the form map and sync — the imports just resolve to null
      - { path: ../phone.js, buildPhase: resources, optional: true }
      - { path: ../body.js, buildPhase: resources, optional: true }
      - { path: ../runner3d.js, buildPhase: resources, optional: true }
      - { path: ../calib3d.js, buildPhase: resources, optional: true }
      - { path: ../sync.js, buildPhase: resources, optional: true }
      - { path: ../vendor, buildPhase: resources, type: folder, optional: true }
      - { path: ../audio, buildPhase: resources, type: folder, optional: true }
      - { path: ../assets, buildPhase: resources, type: folder, optional: true }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukadadiani.airruncoach
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: air-run-coach
        NSMotionUsageDescription: air-run-coach reads headphone motion to analyse your running form in real time.
        NSLocationWhenInUseUsageDescription: air-run-coach uses GPS to measure your run distance.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: false
